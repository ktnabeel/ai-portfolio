[project]
name = "ai-portfolio"
version = "0.1.0"
description = "Python-based AI project portfolio for public display on Hugging Face Spaces and Vercel."
requires-python = ">=3.10"
dependencies = [
    "gradio>=5.0.0",
    "pyyaml>=6.0.0",
    "numpy>=1.24.0",
    "yfinance>=0.2.0",
    "requests>=2.34.2",
    "scikit-learn>=1.7.2",
    "transformers>=4.40.0",
    "torch>=2.0.0",
    "datasets>=2.18.0",
    "langgraph>=1.2.1",
    "langchain>=1.3.1",
    "langchain-openai>=1.2.2",
    "mcp>=1.27.1",
    "keyring>=25.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
